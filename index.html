<style>
    html,
    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
        overflow: hidden;
        background-color: darkslategray;
    }

    li, a {
        color: yellow;

    }

    small {
        text-decoration: line-through;
    }

    .code-container {
        position: absolute;
        left: 50%;
    }

    .code {
        font-family: monospace;
        font-size: x-large;
        white-space: pre-wrap;
        box-sizing: border-box;
        border: 5px solid black;
        padding: 20px;
        background-image: linear-gradient(to right, #417375, #173d4e);
    }

    .dvd-logo {
        width: 10%;
        position: absolute;
        visibility: hidden;
    }
</style>

<script>
    addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("dvd");
        logo.style.visibility = "visible";

        let x = Math.random() * (window.innerWidth - logo.offsetWidth);
        let y = Math.random() * (window.innerHeight - logo.offsetHeight);

        let dx = 1.5;
        let dy = 1.5;

        function updateBounds() {
            maxX = window.innerWidth - logo.offsetWidth;
            maxY = window.innerHeight - logo.offsetHeight;
        }

        let maxX, maxY;
        updateBounds();

        window.addEventListener("resize", updateBounds);

        setInterval(() => {
            x += dx;
            y += dy;

            if (x <= 0 || x >= maxX) {
                dx *= -1;
                x = Math.max(0, Math.min(x, maxX));
            }

            if (y <= 0 || y >= maxY) {
                dy *= -1;
                y = Math.max(0, Math.min(y, maxY));
            }

            logo.style.left = `${x}px`;
            logo.style.top = `${y}px`;
        }, 10);
    });
</script>


<body>
    <img id="dvd" class="dvd-logo" src="images/DVD_logo.svg" alt="dvd logo"/>
